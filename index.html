
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <meta name="description" content="Valentina y Fernando te invitan a celebrar su boda.">

    <title>Valentina & Fernando | Nuestra boda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <main class="portada" id="portada">

        <div class="portada__fondo" aria-hidden="true"></div>
        <div class="portada__sombra" aria-hidden="true"></div>

        <section class="portada__contenido">
            <p class="portada__etiqueta">
                UNA HISTORIA DE AMOR
            </p>

            <h1 class="portada__nombres">
                <span>Valentina</span>
                <span class="portada__y">&</span>
                <span>Fernando</span>
            </h1>

            <p class="portada__mensaje">
                Nuestra boda
            </p>

            <div class="portada__sobre">
                <img
                    class="sobre"
                    src="assets/img/sobre-blanco.png"
                    alt="Sobre blanco de invitación"
                >

                <button
                    class="sello"
                    id="abrirInvitacion"
                    type="button"
                    aria-label="Abrir invitación tocando el sello"
                    aria-expanded="false"
                >
                    <img
                        src="assets/img/sello-plateado.png"
                        alt=""
                    >
                </button>
            </div>

            <p class="portada__instruccion">
                TOCÁ EL SELLO
            </p>
        </section>
    </main>

    <script src="assets/js/main.js" defer></script>
</body>
</html>
